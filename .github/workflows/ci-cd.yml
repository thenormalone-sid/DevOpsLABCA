name: DataGuard CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  APP_PORT: 5000
  PYTHON_VERSION: "3.12"
  # GHCR image names must be lowercase; the repo owner (thenormalone-sid) already is.
  IMAGE: ghcr.io/${{ github.repository_owner }}/dataguard

jobs:
  build-test-scan-deploy:
    name: Test → Build → Scan → Deploy → Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit Tests
        run: pytest tests/test_app.py -v

      - name: Data Quality Tests
        run: pytest tests/test_golden_data.py -v

      - name: Build Docker Image
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker images "$IMAGE"

      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Log In to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy (Push Image to GHCR)
        if: github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Post-Deploy Health Check
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # Verify the image that was actually published, not the local build.
            docker rmi "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
            docker pull "$IMAGE:${{ github.sha }}"
          fi
          docker run -d --name dataguard -p "${APP_PORT}:${APP_PORT}" "$IMAGE:${{ github.sha }}"
          for i in $(seq 1 10); do
            if curl -fsS "http://localhost:${APP_PORT}/health"; then
              echo ""
              echo "Health check passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i/10: service not ready, retrying in 3s..."
            sleep 3
          done
          echo "Health check failed after 10 attempts"
          docker logs dataguard
          exit 1

      - name: Stop Container
        if: always()
        run: docker rm -f dataguard || true
